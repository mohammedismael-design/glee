name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glee_user
          POSTGRES_PASSWORD: glee_password
          POSTGRES_DB: glee_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:prod
        env:
          DATABASE_URL: postgresql://glee_user:glee_password@localhost:5432/glee_test

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://glee_user:glee_password@localhost:5432/glee_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          EMAIL_VERIFY_SECRET: test-email-verify-secret
          PII_ENCRYPTION_KEY: test-pii-encryption-key-32-chars!!
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          SMTP_HOST: localhost
          SMTP_USER: test
          SMTP_PASS: test
          EMAIL_FROM_ADDRESS: test@glee.com
          CORS_ORIGINS: http://localhost:3000
          FRONTEND_URL: http://localhost:3000
          API_URL: http://localhost:4000

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t glee-api:${{ github.sha }} .

      - name: Log in to registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag glee-api:${{ github.sha }} ghcr.io/${{ github.repository }}/glee-api:${{ github.sha }}
          docker tag glee-api:${{ github.sha }} ghcr.io/${{ github.repository }}/glee-api:latest
          docker push ghcr.io/${{ github.repository }}/glee-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/glee-api:latest
